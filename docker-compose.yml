services:
  postgres:
    image: postgres:16
    container_name: clinicbooking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinicbooking
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: clinicbooking-smtp
    ports:
      - "5000:80"    # Web UI
      - "2525:25"    # SMTP port
    restart: unless-stopped

volumes:
  pgdata: